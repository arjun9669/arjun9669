<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" role="img" aria-label="GitHub overview card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f2430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="100%" stop-color="#bf91f3"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="618" height="218" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="620" height="6" rx="3" fill="url(#accent)"/>

  <text x="28" y="42" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">GitHub Overview</text>
  <text x="28" y="67" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">arjun9669 • AI engineering, machine learning and analytics</text>

  <g transform="translate(28 96)">
    <rect width="165" height="86" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="82.5" y="37" text-anchor="middle" fill="#70a5fd" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">8</text>
    <text x="82.5" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Public repositories</text>
  </g>

  <g transform="translate(211 96)">
    <rect width="165" height="86" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="82.5" y="37" text-anchor="middle" fill="#bf91f3" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">4</text>
    <text x="82.5" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Core project areas</text>
  </g>

  <g transform="translate(394 96)">
    <rect width="198" height="86" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="38" cy="32" r="8" fill="#3fb950" filter="url(#glow)">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="37" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Active</text>
    <text x="99" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Building AI products</text>
  </g>
</svg>