name: Use Local Analytics Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-local-analytics-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace failing external analytics cards
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old_stats = '<img width="49%" src="https://github-readme-stats.vercel.app/api?username=arjun9669&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&cache_seconds=86400" alt="Arjun Kumar GitHub statistics"/>'
          new_stats = '<img width="49%" src="./assets/github-overview-card.svg" alt="Arjun Kumar GitHub overview"/>'

          old_langs = '<img width="49%" src="https://github-readme-stats.vercel.app/api/top-langs/?username=arjun9669&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&cache_seconds=86400" alt="Most used GitHub languages"/>'
          new_langs = '<img width="49%" src="./assets/github-language-card.svg" alt="Arjun Kumar technology focus"/>'

          if old_stats not in text or old_langs not in text:
              raise SystemExit('Expected analytics image lines were not found.')

          text = text.replace(old_stats, new_stats, 1)
          text = text.replace(old_langs, new_langs, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Replace broken analytics cards with local SVG assets"
          git push
