name: Rename LRB Roles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-lrb-roles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Rename LRB roles
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '🧠 Machine Learning Associate — LRB Infotech, Abu Dhabi · Remote',
              '🧠 AI Engineer Associate — LRB Infotech, Abu Dhabi · Remote'
          )
          text = text.replace(
              '📈 Machine Learning Intern — LRB Infotech, Abu Dhabi · Remote',
              '📈 AI Engineer Intern — LRB Infotech, Abu Dhabi · Remote'
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Rename LRB roles to AI Engineer Associate and Intern"
          git push
