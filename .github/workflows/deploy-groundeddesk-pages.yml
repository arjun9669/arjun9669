name: Deploy GroundedDesk to GitHub Pages

# Manual by design. Enable Settings -> Pages -> Build and deployment -> GitHub Actions first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: groundeddesk-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/groundeddesk-ai
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
