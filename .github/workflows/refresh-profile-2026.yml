  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#1f2430"/></linearGradient></defs>
  <rect x="1" y="1" width="618" height="218" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <text x="28" y="42" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Technology Focus</text>
  <text x="28" y="67" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Current AI engineering focus across professional and public work</text>
  <g transform="translate(28 94)"><text x="0" y="16" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Generative AI &amp; Enterprise RAG</text><rect x="0" y="27" width="540" height="12" rx="6" fill="#30363d"/><rect x="0" y="27" width="470" height="12" rx="6" fill="#70a5fd"><animate attributeName="width" values="0;470" dur="1.2s" fill="freeze"/></rect><text x="0" y="67" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Document Intelligence &amp; Multilingual AI</text><rect x="0" y="78" width="540" height="12" rx="6" fill="#30363d"/><rect x="0" y="78" width="430" height="12" rx="6" fill="#bf91f3"><animate attributeName="width" values="0;430" dur="1.4s" fill="freeze"/></rect><text x="0" y="118" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">AI/ML Engineering &amp; Automation</text><rect x="0" y="129" width="540" height="12" rx="6" fill="#30363d"/><rect x="0" y="129" width="390" height="12" rx="6" fill="#3fb950"><animate attributeName="width" values="0;390" dur="1.6s" fill="freeze"/></rect></g>
