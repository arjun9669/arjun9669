- Built predictive models with more than **80% forecasting accuracy**
- Supported business planning and resource-allocation decisions'''
          associate_new = '''- Developed and productionized **AI/ML classification and regression solutions** using Python
- Built and optimized more than **10 machine-learning models**, consistently achieving accuracy above **85%**
- Engineered scalable **AI data pipelines** processing over **1 million records**
- Prepared structured and unstructured datasets for **machine-learning and Generative AI workflows**
- Translated business requirements into practical **AI/ML engineering solutions**
- Reduced manual reporting effort by approximately **30%** through data and model-driven automation
- Built predictive models with more than **80% forecasting accuracy**
- Supported business planning and resource-allocation decisions with AI-assisted analytical outputs'''
          text = text.replace(associate_old, associate_new, 1)

          intern_old = '''- Created ML-ready pipelines for cleaning, merging and validating data
- Processed datasets containing more than **500,000 records**
- Maintained strong data integrity for downstream ML workflows
- Conducted exploratory analysis across more than **15 datasets**
- Performed feature engineering and targeted feature selection
- Improved average model performance by approximately **12%**
- Supported classification, regression and data-preprocessing tasks'''
          intern_new = '''- Built **AI/ML-ready data pipelines** for cleaning, merging, validation and model preparation
- Processed datasets containing more than **500,000 records**
- Maintained strong data integrity for downstream **AI and machine-learning workflows**
- Conducted exploratory analysis across more than **15 datasets** to identify model-ready patterns and features
- Performed feature engineering and targeted feature selection for supervised-learning workflows
- Improved average model performance by approximately **12%**
- Supported classification, regression, preprocessing and model-evaluation tasks across AI/ML projects'''
          text = text.replace(intern_old, intern_new, 1)

          new_feature = '''<td width="50%" valign="top">
<h3>🌐 Multilingual Document Intelligence & RAG</h3>

<p>Private document-grounded AI workflows designed for multilingual knowledge retrieval, document understanding and secure enterprise use.</p>

<strong>Key capabilities</strong>
<ul>
<li>OCR-based document extraction</li>
<li>Retrieval-Augmented Generation (RAG)</li>
<li>Multilingual language-model workflows</li>
<li>BGE-M3 multilingual embeddings</li>
<li>Vector search and document grounding</li>
<li>Secure deployment patterns for private knowledge systems</li>
</ul>

<p><strong>Stack:</strong><br/>
<code>Python</code> <code>OCR</code> <code>RAG</code> <code>BGE-M3</code> <code>Vector Search</code> <code>FastAPI</code></p>

<img src="https://img.shields.io/badge/Professional%20Project-Source%20Private-7C3AED?style=for-the-badge" alt="Professional project — private source"/>
</td>'''
          pattern = r'<td width="50%" valign="top">\n<h3>🌦️ Weather Prediction & AI Chatbot</h3>.*?</td>'
          text, n = re.subn(pattern, new_feature, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Featured Weather project card not found')

          analytics = '''# 📊 GitHub Portfolio Snapshot

<div align="center">

<img width="49%" src="./assets/github-overview-card.svg" alt="Arjun Kumar GitHub portfolio overview"/>
<img width="49%" src="./assets/github-language-card.svg" alt="Arjun Kumar AI technology focus"/>

<br/><br/>

<a href="https://github.com/arjun9669?tab=repositories">
<img src="https://img.shields.io/badge/Explore%20the%20Full%20Portfolio-181717?style=for-the-badge&logo=github&logoColor=white" alt="Explore Arjun Kumar repositories"/>
</a>

</div>'''
          text, n = re.subn(r'# 📈 GitHub Analytics\n.*?(?=\n---\n\n# 🌐 Languages)', analytics, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('GitHub Analytics section not found')

          readme_path.write_text(text, encoding='utf-8')

          # Refresh the custom header messaging to match the current role.
          banner = Path('assets/arjun-ai-banner.svg')
          b = banner.read_text(encoding='utf-8')
          b = b.replace('GENERATIVE AI • ENTERPRISE RAG • AGENTIC SYSTEMS', 'GENERATIVE AI • DOCUMENT INTELLIGENCE • ENTERPRISE RAG')
          b = b.replace('LANGCHAIN • FASTAPI • VECTOR DATABASES', 'MULTILINGUAL AI • AUTOMATION • AGENTIC SYSTEMS')
          b = b.replace('FROM DATA ANALYTICS TO PRODUCTION AI', 'BUILDING PRACTICAL ENTERPRISE AI PRODUCTS')
          banner.write_text(b, encoding='utf-8')

          # Stable local snapshot card with no hard-coded repository count.
          overview = '''<svg xmlns="http://www.w3.org/2000/svg" width="620" height="220" viewBox="0 0 620 220" role="img" aria-label="GitHub portfolio overview card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#1f2430"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#70a5fd"/><stop offset="100%" stop-color="#bf91f3"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="618" height="218" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="620" height="6" rx="3" fill="url(#accent)"/>
  <text x="28" y="42" fill="#c9d1d9" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">AI Engineering Portfolio</text>
  <text x="28" y="67" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Enterprise AI • RAG • Document Intelligence • Machine Learning</text>
  <g transform="translate(28 96)"><rect width="165" height="86" rx="12" fill="#0d1117" stroke="#30363d"/><text x="82.5" y="36" text-anchor="middle" fill="#70a5fd" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">AI ENGINEER</text><text x="82.5" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Current focus</text></g>
  <g transform="translate(211 96)"><rect width="165" height="86" rx="12" fill="#0d1117" stroke="#30363d"/><text x="82.5" y="36" text-anchor="middle" fill="#bf91f3" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">PRODUCTION AI</text><text x="82.5" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Build • deploy • scale</text></g>
  <g transform="translate(394 96)"><rect width="198" height="86" rx="12" fill="#0d1117" stroke="#30363d"/><circle cx="38" cy="32" r="7" fill="#3fb950"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle><text x="58" y="37" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">ACTIVE</text><text x="99" y="62" text-anchor="middle" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13">Dubai, UAE</text></g>
</svg>'''
