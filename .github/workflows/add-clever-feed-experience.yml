name: Add Clever Feed Experience

# Trigger profile experience update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-clever-feed-experience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Add current AI Engineer experience
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          if 'Clever Feed IT Services' in text:
              print('Experience already present; no change required.')
              raise SystemExit(0)

          marker = '''# 💼 Professional Experience

<details open>
<summary><strong>🤖 AI Engineer — MTA Building Materials Trading, Dubai</strong></summary>'''

          replacement = '''# 💼 Professional Experience

<details open>
<summary><strong>🤖 AI Engineer — Clever Feed IT Services, Dubai, UAE</strong></summary>

<br/>

**July 2026 – Present**

*Building and evaluating AI-enabled product and client solutions across document intelligence, automation, multilingual AI workflows, and proof-of-concept delivery.*

- Support AI adoption initiatives for **Mubarak Marine** through employee training on practical AI tools, departmental AI software evaluation, and AI-assisted **2D-to-3D presentation workflows**.
- Contribute to the design of **private document-grounded systems** using OCR, Retrieval-Augmented Generation (RAG), multilingual language models, vector search, and secure cloud deployment patterns.

</details>

<details>
<summary><strong>🤖 AI Engineer — MTA Building Materials Trading, Dubai</strong></summary>'''

          if marker not in text:
              raise SystemExit('Professional Experience marker was not found in README.md')

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit profile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Add current AI Engineer experience at Clever Feed IT Services"
          git push