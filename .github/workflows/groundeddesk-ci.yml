name: groundeddesk-source-tests

on:
  pull_request:
    paths:
      - "projects/groundeddesk-ai/**"
      - ".github/workflows/groundeddesk-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/groundeddesk-ai/**"
      - ".github/workflows/groundeddesk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax
        run: |
          node --check projects/groundeddesk-ai/retrieval.mjs
          node --check projects/groundeddesk-ai/report.mjs
          node --check projects/groundeddesk-ai/hybrid.mjs
          node --check projects/groundeddesk-ai/semantic.mjs
          node --check projects/groundeddesk-ai/generation.mjs
          node --check projects/groundeddesk-ai/app.mjs
          node --check projects/groundeddesk-ai/eval/run.mjs
      - name: Run deterministic retrieval tests
        run: node --test projects/groundeddesk-ai/tests/*.test.mjs
      - name: Evaluate example corpus, refusal and citation provenance
        run: |
          node projects/groundeddesk-ai/eval/run.mjs --strict
          node projects/groundeddesk-ai/eval/run.mjs --json > groundeddesk-evaluation.json
      - name: Archive reproducible metrics
        uses: actions/upload-artifact@v4
        with:
          name: groundeddesk-offline-eval
          path: groundeddesk-evaluation.json
          retention-days: 14
