name: Run Profile Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-profile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile updates
        run: python .github/profile_refresh.py
      - name: Remove temporary maintenance files
        run: |
          rm -f .github/profile_refresh.py
          rm -f .github/workflows/add-clever-feed-experience.yml
          rm -f .github/workflows/fix-readme-analytics.yml
          rm -f .github/workflows/insert-current-experience.yml
          rm -f .github/workflows/rename-lrb-roles.yml
          rm -f .github/workflows/use-local-analytics-cards.yml
          rm -f .github/workflows/refresh-profile-2026.yml
          rm -f .github/workflows/run-profile-refresh.yml
      - name: Commit complete profile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh GitHub profile for current AI Engineer role"
          git push
